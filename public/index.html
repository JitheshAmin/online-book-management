
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Book Management System</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Online Book Management System</h1>

        <h2>Add / Update Book</h2>

        <form id="bookForm">

            <input
                type="number"
                id="bookId"
                placeholder="Book ID"
                min="1"
                step="1"
                required
            >

            <input
                type="text"
                id="title"
                placeholder="Book Title"
                maxlength="150"
                required
            >

            <input
                type="text"
                id="author"
                placeholder="Author Name"
                maxlength="100"
                required
            >

            <input
                type="number"
                id="price"
                placeholder="Book Price"
                min="0"
                step="0.01"
                required
            >

            <button type="submit" id="submitBtn">
                Add Book
            </button>

            <button type="button" id="cancelBtn" hidden>
                Cancel Update
            </button>

        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <h2>Book List</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Price (₹)</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="bookList">
            </tbody>
        </table>

    </div>

    <script src="script.js"></script>

</body>
</html>
